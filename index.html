<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOP GLASS — Финансовый дашборд</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg1:#eef2ff; --bg2:#faf0fb; --bg3:#eafcff;
  --panel:#ffffff; --panel-br:#e8ecf7;
  --txt:#161d2f; --dim:#7a86a8;
  --g1:#6366f1; --g2:#ec4899; --g3:#06b6d4;
  --good:#10b981; --warn:#f59e0b; --bad:#ef4444;
  --shadow:0 8px 24px rgba(80,90,160,.10);
}
*{box-sizing:border-box;}
body{margin:0;font-family:"Segoe UI",-apple-system,Roboto,Arial,sans-serif;color:var(--txt);
  background:linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg3));min-height:100vh;}
.scroll::-webkit-scrollbar{height:10px;width:10px;}
.scroll::-webkit-scrollbar-thumb{background:linear-gradient(var(--g1),var(--g3));border-radius:6px;}
.scroll::-webkit-scrollbar-track{background:#e8ecf7;border-radius:6px;}

header.app{display:flex;align-items:center;gap:14px;padding:16px 26px;
  background:rgba(255,255,255,.75);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--panel-br);position:sticky;top:0;z-index:30;}
.logo{font-weight:900;font-size:24px;letter-spacing:1.5px;
  background:linear-gradient(90deg,var(--g1),var(--g2),var(--g3));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.subtitle{font-size:13px;color:var(--dim);}
.cloud-badge{margin-left:auto;font-size:12.5px;padding:7px 14px;border-radius:20px;
  background:#e7fbf1;color:var(--good);font-weight:700;}
.cloud-badge.bad{background:#fdeaea;color:var(--bad);}

nav.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 20px;
  background:rgba(255,255,255,.6);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--panel-br);position:sticky;top:65px;z-index:29;}
nav.tabs button{border:none;background:transparent;color:var(--dim);font-weight:700;font-size:14px;
  padding:11px 20px;border-radius:14px;cursor:pointer;white-space:nowrap;transition:.18s;}
nav.tabs button:hover{background:#eef1fc;color:var(--txt);}
nav.tabs button.active{background:linear-gradient(90deg,var(--g1),var(--g2));color:#fff;
  box-shadow:0 6px 16px rgba(120,80,220,.35);}

main{padding:24px;max-width:1440px;margin:0 auto;}
.tabpage{display:none;}
.tabpage.active{display:block;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

h2{font-size:19px;margin:26px 0 14px;padding-left:14px;position:relative;font-weight:800;}
h2::before{content:"";position:absolute;left:0;top:1px;bottom:1px;width:6px;border-radius:4px;
  background:linear-gradient(180deg,var(--g1),var(--g2));}
h2:first-child{margin-top:0;}

.panel{background:var(--panel);border:1px solid var(--panel-br);border-radius:18px;
  padding:18px;margin-bottom:18px;box-shadow:var(--shadow);}

.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:6px;}
@media(max-width:1050px){.kpis{grid-template-columns:repeat(2,1fr);}}
.kpi{border-radius:18px;padding:18px 20px;color:#fff;position:relative;overflow:hidden;
  box-shadow:0 10px 22px rgba(80,90,160,.18);}
.kpi.k1{background:linear-gradient(135deg,#6366f1,#8b5cf6);}
.kpi.k2{background:linear-gradient(135deg,#06b6d4,#0ea5e9);}
.kpi.k3{background:linear-gradient(135deg,#10b981,#22c55e);}
.kpi.k4{background:linear-gradient(135deg,#f59e0b,#f97316);}
.kpi.k5{background:linear-gradient(135deg,#ec4899,#f43f5e);}
.kpi .lbl{font-size:12.5px;opacity:.92;margin-bottom:8px;font-weight:600;}
.kpi .val{font-size:23px;font-weight:900;letter-spacing:.3px;}
.kpi::after{content:"";position:absolute;right:-20px;top:-20px;width:90px;height:90px;
  border-radius:50%;background:rgba(255,255,255,.12);}

.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px;}
@media(max-width:960px){.charts-grid{grid-template-columns:1fr;}}
.chart-box{background:var(--panel);border:1px solid var(--panel-br);border-radius:18px;
  padding:16px;height:320px;box-shadow:var(--shadow);}
.chart-box.tall{height:360px;}
.chart-box h3{margin:0 0 10px;font-size:14px;color:var(--txt);font-weight:800;}
.chart-box canvas{max-height:270px;}

table{border-collapse:collapse;width:100%;font-size:13px;}
th,td{padding:9px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--panel-br);}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--panel);}
thead th{color:#fff;font-weight:700;font-size:12px;
  background:linear-gradient(90deg,#6366f1,#8b5cf6);}
thead th:first-child{background:#6366f1;}
tbody tr:hover td{background:#f3f6ff;}
tr.total td{font-weight:900;background:#eef2ff;}
tr.total td:first-child{background:#eef2ff;}
.good{color:var(--good);font-weight:800;}
.warn{color:var(--warn);font-weight:800;}
.bad{color:var(--bad);font-weight:800;}
.tablewrap{overflow:auto;max-height:600px;border-radius:14px;}

select{font-family:inherit;font-size:14px;padding:9px 14px;border-radius:12px;
  border:1px solid var(--panel-br);background:#fff;color:var(--txt);font-weight:600;cursor:pointer;}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.pill{font-size:12.5px;color:var(--dim);}

.store-block{margin-bottom:20px;}
.store-block .st-head{display:flex;align-items:center;gap:10px;margin:0 0 12px;}
.st-dot{width:14px;height:14px;border-radius:50%;}
.st-name{font-size:16px;font-weight:800;}
.stock-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:16px;}
@media(max-width:900px){.stock-grid{grid-template-columns:1fr;}}
.mini-chart{height:250px;}

footer{text-align:center;color:var(--dim);font-size:12px;padding:24px;}
</style>
</head>

function coefNetwork(key){ const rev=networkTotals(key).rev; const st=stockRetailTotal(key); return st?rev/st:null; }
function coefStore(key,store){ const m=data.months[key]; if(!m) return null;
  const rev=m.stores&&m.stores[store]?m.stores[store].rev:null;
  const retail=m.stocks&&m.stocks[store]?m.stocks[store].retail:null;
  if(rev==null||!retail) return null; return rev/retail; }
function storeStockMonths(store){ return monthKeysSorted().filter(k=> data.months[k].stocks && data.months[k].stocks[store]); }

/* ======================= ГРАФИКИ ======================= */
const chartInstances={};
function mkChart(id,type,cfg,opts={}){
  const el=document.getElementById(id); if(!el||!window.Chart) return null;
  if(chartInstances[id]) chartInstances[id].destroy();
  const isPie=(type==='pie'||type==='doughnut');
  const scales=isPie?{}:{
    x:{ticks:{color:'#7a86a8',font:{size:11}},grid:{color:'rgba(120,130,180,.09)'}},
    y:{ticks:{color:'#7a86a8',font:{size:11},callback:v=>fmtM(v)},grid:{color:'rgba(120,130,180,.09)'}}
  };
  if(opts.scalesOverride) Object.assign(scales,opts.scalesOverride);
  const options=Object.assign({
    responsive:true,maintainAspectRatio:false,
    plugins:{legend:{position:opts.legendRight?'right':'top',labels:{color:'#161d2f',boxWidth:12,font:{size:11.5},padding:12}}},
    scales
  },opts.chartOptions||{});
  chartInstances[id]=new Chart(el.getContext('2d'),{type,data:cfg,options});
  return chartInstances[id];
}

/* ======================= НАВИГАЦИЯ ======================= */
const TABS=[
  {id:'dashboard',label:'📊 Дашборд'},
  {id:'stocks',label:'📦 Склады по точкам'},
  {id:'history',label:'📈 История выручки'},
  {id:'turnover',label:'🔄 Оборачиваемость'},
  {id:'storedetail',label:'🏪 Магазины'}
];
function buildNav(){
  const nav=document.getElementById('tabsNav');
  nav.innerHTML=TABS.map(t=>`<button data-tab="${t.id}">${t.label}</button>`).join('');
  nav.querySelectorAll('button').forEach(b=> b.addEventListener('click',()=>showTab(b.dataset.tab)));
}
function showTab(id){
  document.querySelectorAll('nav.tabs button').forEach(b=> b.classList.toggle('active',b.dataset.tab===id));
  document.querySelectorAll('.tabpage').forEach(p=> p.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  if(id==='dashboard') renderDashboard();
  if(id==='stocks') renderStocks();
  if(id==='history') renderHistory();
  if(id==='turnover') renderTurnover();
  if(id==='storedetail') renderStoreDetail();
}

/* ======================= ЗАГРУЗКА CHART.JS (несколько источников) ======================= */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
async function ensureChart(){ if(window.Chart) return true;
  const cdns=['https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js','https://unpkg.com/chart.js@4.4.4/dist/chart.umd.min.js','https://cdn.skypack.dev/chart.js@4.4.4/dist/chart.umd.min.js'];
  for(const u of cdns){ if(window.Chart) break; try{ await loadScript(u); }catch(e){} }
  return !!window.Chart; }

/* ======================= СТАРТ ======================= */
(async function init(){
  buildNav();
  const ok=await ensureChart();
  if(!ok){ const b=document.getElementById('cloudBadge'); if(b){ b.textContent='⚠️ Графики недоступны (нет CDN)'; b.classList.add('bad'); } }
  showTab('dashboard');
})();
</script>
